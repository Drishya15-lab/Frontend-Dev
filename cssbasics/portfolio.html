<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drishya Singh | Portfolio</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdfdfd;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #004080;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    header h1 {
      font-size: 2rem; /* rem unit */
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2em; /* em unit */
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Main section */
    main {
      flex: 1;
      padding: 120px 5% 2rem; /* px and % units */
    }

    .bio {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
    }

    .bio img {
      width: 200px; /* px unit */
      height: auto;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .bio .text {
      max-width: 600px;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* Footer */
    footer {
      background-color: #004080;
      color: #fff;
      text-align: center;
      padding: 2vh; /* vh unit */
      font-size: 1rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Drishya Singh</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="bio">
      <img src="https://via.placeholder.com/200" alt="Drishya's profile photo" />
      <div class="text">
        <p>
          Hi! I'm Drishya, a BTech student passionate about web development, grammar mastery, and cracking campus placements. I love building clean HTML/CSS pages and troubleshooting Git like a pro!
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Drishya Singh. All rights reserved.</p>
  </footer>
</body>
</html>
