<form autocomplete="off">
  <label>Username:</label>
  <input type="text" name="username" required><br>

  <label>Password:</label>
  <input type="password" name="password" required><br>

  <button type="submit">Login</button>
</form>

<p><strong>Note:</strong> Turning off autocomplete prevents browsers from storing sensitive data like passwords or card numbers, reducing the risk of unauthorized access on shared devices.</p>
