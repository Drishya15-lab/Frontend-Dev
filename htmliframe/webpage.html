<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the title of the webpage shown in browser tab -->
  <title>My Sample Webpage</title>

  <!-- Declares character encoding for proper text rendering -->
  <meta charset="UTF-8">

  <!-- Provides a short description for SEO and previews -->
  <meta name="description" content="This is a demo page showing key head elements in HTML.">

  <!-- Specifies the author of the webpage -->
  <meta name="author" content="Drishya Singh">

  <!-- Sets a base URL for all relative links on the page -->
  <base href="https://example.com/">

  <!-- Links to a favicon or external resource like CSS -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS styles (can be empty or filled later) -->
  <style>
    /* Custom styles go here */
  </style>

  <!-- JavaScript code or external script link (can be empty) -->
  <script>
    // JS logic can be added here
  </script>
</head>
<body>
  <h1>Welcome to My Sample Webpage</h1>
  <p>This page demonstrates all essential head tags with comments.</p>
</body>
</html>
